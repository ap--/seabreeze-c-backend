[build-system]
requires = [
    "scikit-build-core>=0.9",
    "cython>=3.1",
    "setuptools_scm>=8",
]
build-backend = "scikit_build_core.build"

[tool.setuptools_scm]
version_scheme = "post-release"

[project]
name = "seabreeze_c_backend"
description = "Seabreeze C Backend. Use together with `seabreeze` package."
license.file = "LICENSE.md"
authors = [
  { name = "Andreas Poehlmann", email = "andreas@poehlmann.io" }
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]
requires-python = ">=3.8"
dependencies = [
    "numpy >=1.20.0",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/ap--/seabreeze-c-backend"
Source = "https://github.com/ap--/seabreeze-c-backend"


[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/seabreeze_c_backend"]
# the extension module is compiled against the stable ABI of python 3.11
wheel.py-api = "cp311"
sdist.exclude = ["build", "dist", ".github", ".pixi"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[[tool.scikit-build.overrides]]
if.python-version = "<3.11"
# the buffer protocol is only part of the stable ABI since python 3.11
wheel.py-api = ""
cmake.define.SEABREEZE_C_BACKEND_LIMITED_API = "OFF"


[tool.black]
target-version = ['py38']

[tool.isort]
profile = "black"
py_version = "38"

[tool.cibuildwheel]
build-verbosity = 2
# python >=3.12 is covered by the cp311 abi3 wheel
build = ["cp38-*", "cp39-*", "cp310-*", "cp311-*"]
skip = ["*-musllinux_*", "pp*"]
test-command = [
    "python -c \"import seabreeze_c_backend\"",
]

[tool.cibuildwheel.linux]
before-build = "yum install -y libusb-devel"

[tool.cibuildwheel.windows]
config-settings = { "cmake.define.SEABREEZE_C_BACKEND_DISABLE_FH4" = "ON" }

[tool.mypy]
python_version = "3.8"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
files = "./src/**/*.py"
exclude = """
(?x)(
   ^build|
   ^docs|
   ^tests|
   setup.py
)
"""

[[tool.mypy.overrides]]
module = "seabreeze_c_backend._libseabreeze_wrapper"
ignore_missing_imports = true

[tool.cython-lint]
ignore = ['E501']
