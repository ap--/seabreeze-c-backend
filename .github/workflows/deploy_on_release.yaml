name: deploy on release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build sdist on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Install build
        run: python -m pip install build --user
      - name: Build the source tarball
        run: python -m build --sdist .
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist

  build_libseabreeze:
    name: Build libseabreeze shared library on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            target: 'linux-x86_64'
          - os: 'ubuntu-24.04-arm'
            target: 'linux-aarch64'
          - os: 'windows-latest'
            target: 'windows-x86_64'
          - os: 'macOS-latest'
            target: 'macos-arm64'
            cmake_extra_args: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: 'macOS-latest'
            target: 'macos-x86_64'
            cmake_extra_args: >-
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
    steps:
      - uses: actions/checkout@v7
      - name: Setup libusb-dev
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-dev
      # `cmake --build --parallel` without a job count translates to `make -j`,
      # which compiles all ~450 translation units at once and exhausts the
      # memory of the runners. CMAKE_BUILD_PARALLEL_LEVEL is only honored if
      # `--parallel` is not passed on the command line.
      - name: Limit the build parallelism to the number of available cpus
        shell: bash
        run: |
          jobs="${NUMBER_OF_PROCESSORS:-$(getconf _NPROCESSORS_ONLN)}"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${jobs:-4}" >> "$GITHUB_ENV"
      - name: Configure libseabreeze
        run: >
          cmake -S src/libseabreeze -B build/libseabreeze
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix
          ${{ matrix.cmake_extra_args }}
      - name: Build and install libseabreeze
        run: |
          cmake --build build/libseabreeze --config Release
          cmake --install build/libseabreeze --config Release
      - name: Archive the shared library
        working-directory: prefix
        run: >
          cmake -E tar cf
          ${{ github.workspace }}/libseabreeze-${{ matrix.target }}.zip
          --format=zip -- .
      - uses: actions/upload-artifact@v7
        with:
          # artifact names must be unique for actions/upload-artifact
          name: libseabreeze-${{ matrix.target }}
          path: ./libseabreeze-${{ matrix.target }}.zip

  build_wheels:
    name: Build wheels on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - os: 'ubuntu-latest'
            target: 'linux-x86_64'
            arch: 'x86_64'
          - os: 'ubuntu-24.04-arm'
            target: 'linux-aarch64'
            arch: 'aarch64'
          - os: 'windows-latest'
            target: 'windows-x86_64'
            arch: 'AMD64'
          - os: 'macOS-latest'
            target: 'macos-arm64'
            arch: 'arm64'
          - os: 'macOS-latest'
            target: 'macos-x86_64'
            arch: 'x86_64'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp311-*
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          # artifact names must be unique for actions/upload-artifact
          name: wheels-${{ matrix.target }}
          path: ./wheelhouse/*.whl

  deploy_pypi:
    name: deploy to pypi
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: ./dist
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi_password }}

  upload_release_assets:
    name: upload release assets
    needs: [build_wheels, build_libseabreeze]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./assets
      - uses: actions/download-artifact@v8
        with:
          pattern: libseabreeze-*
          merge-multiple: true
          path: ./assets
      - name: Attach the wheels and shared library archives to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ./assets/*
