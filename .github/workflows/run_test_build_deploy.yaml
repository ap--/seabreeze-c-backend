name: test build deploy

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: Build wheel on Linux (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup libusb-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-dev
      - name: Install build
        run: |
          python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel .
      - uses: actions/upload-artifact@v7
        with:
          name: py311-wheel
          path: ./dist/*.whl

  test_wheel:
    name: Test wheel on Linux (Python ${{ matrix.python-version }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Setup libusb-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-dev
      - uses: actions/download-artifact@v8
        with:
          name: py311-wheel
          path: ./dist
      - name: Install wheel and pytest
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install ./dist/*.whl
      - name: Run the tests
        run: python -m pytest -v tests

  build_libseabreeze:
    name: Build libseabreeze shared library on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            target: 'linux-x86_64'
          - os: 'ubuntu-24.04-arm'
            target: 'linux-aarch64'
          - os: 'windows-latest'
            target: 'windows-x86_64'
          - os: 'macOS-latest'
            target: 'macos-arm64'
            cmake_extra_args: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: 'macOS-latest'
            target: 'macos-x86_64'
            cmake_extra_args: >-
              -DCMAKE_OSX_ARCHITECTURES=x86_64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup libusb-dev
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-dev
      - name: Configure libseabreeze
        run: >
          cmake -S src/libseabreeze -B build/libseabreeze
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix
          ${{ matrix.cmake_extra_args }}
      - name: Build and install libseabreeze
        run: |
          cmake --build build/libseabreeze --config Release --parallel
          cmake --install build/libseabreeze --config Release
      - name: Archive the shared library
        working-directory: prefix
        run: >
          cmake -E tar cf
          ${{ github.workspace }}/libseabreeze-${{ matrix.target }}.zip
          --format=zip -- .
      - uses: actions/upload-artifact@v7
        with:
          # artifact names must be unique for actions/upload-artifact
          name: libseabreeze-${{ matrix.target }}
          path: ./libseabreeze-${{ matrix.target }}.zip

      - name: Build the extension module against the installed libseabreeze
        if: ${{ runner.os == 'Linux' }}
        run: >
          python -m pip install -v .
          --config-settings=cmake.define.SEABREEZE_C_BACKEND_USE_SYSTEM_LIBSEABREEZE=ON
          --config-settings=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
      - name: Verify import with installed shared libseabreeze
        if: ${{ runner.os == 'Linux' }}
        run: >
          LD_LIBRARY_PATH=${{ github.workspace }}/prefix/lib:$LD_LIBRARY_PATH
          python -c "import seabreeze_c_backend"

  build_sdist:
    name: Build sdist on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Install build
        run: python -m pip install build --user
      - name: Build the source tarball
        run: python -m build --sdist .
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist

  build_wheels:
    name: Build wheels on ${{ matrix.target }}
    needs: [test_wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - os: 'ubuntu-latest'
            target: 'linux-x86_64'
            arch: 'x86_64'
          - os: 'ubuntu-24.04-arm'
            target: 'linux-aarch64'
            arch: 'aarch64'
          - os: 'windows-latest'
            target: 'windows-x86_64'
            arch: 'AMD64'
          - os: 'macOS-latest'
            target: 'macos-arm64'
            arch: 'arm64'
          - os: 'macOS-latest'
            target: 'macos-x86_64'
            arch: 'x86_64'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp311-*
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          # artifact names must be unique for actions/upload-artifact
          name: wheels-${{ matrix.target }}
          path: ./wheelhouse/*.whl
