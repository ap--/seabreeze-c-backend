name: test build deploy

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: Build and test on Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Setup libusb-dev
        run: |
          sudo apt-get install -y libusb-dev
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -v .
      - name: Run the tests
        run: python -m pytest -v tests

  build_libseabreeze:
    name: Build libseabreeze as a shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup libusb-dev
        run: |
          sudo apt-get install -y libusb-dev
      - name: Configure libseabreeze
        run: >
          cmake -S src/libseabreeze -B build/libseabreeze
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix
      - name: Build and install libseabreeze
        run: |
          cmake --build build/libseabreeze --parallel
          cmake --install build/libseabreeze
      - name: Build the extension module against the installed libseabreeze
        run: >
          python -m pip install -v .
          --config-settings=cmake.define.SEABREEZE_C_BACKEND_USE_SYSTEM_LIBSEABREEZE=ON
          --config-settings=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
      - name: Verify import with installed shared libseabreeze
        run: >
          LD_LIBRARY_PATH=${{ github.workspace }}/prefix/lib:$LD_LIBRARY_PATH
          python -c "import seabreeze_c_backend"

  build_sdist:
    name: Build sdist on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Install build
        run: python -m pip install build --user
      - name: Build the source tarball
        run: python -m build --sdist .
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist

  build_wheels:
    name: Build wheels on ${{ matrix.os }} - ${{ matrix.arch }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 5
      matrix:
        arch: ['x86_64']
        os:
          - 'ubuntu-latest'
          - 'windows-latest'
          - 'macOS-latest'
        include:
          - os: 'ubuntu-latest'
            arch: 'aarch64'
          - os: 'macOS-latest'
            arch: 'arm64'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: ${{ runner.os == 'Linux' && matrix.arch != 'x86_64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: cp311-*
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          # artifact names must be unique for actions/upload-artifact@v4
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  deploy_pypi:
    name: deploy to pypi
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: false
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: ./dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./dist
      # push all tagged versions to pypi.org
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
